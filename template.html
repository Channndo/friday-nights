<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0b0e13;color:#e8ecf2;font-family:Inter,system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.screen{display:none;position:fixed;inset:0;flex-direction:column}
.screen.active{display:flex}
h1,h2,h3,.pk-name,.ab,.sc,.bq,.call,.big,.role,#banner{font-family:Oswald,"Arial Narrow",sans-serif;letter-spacing:.02em}
.big{background:linear-gradient(180deg,#ffcf3d,#e5a800);color:#1a1300;font-weight:700;font-size:20px;padding:10px 34px;border-radius:8px;text-transform:uppercase;box-shadow:0 4px 0 #8a6500}
.big:active{transform:translateY(2px);box-shadow:0 2px 0 #8a6500}
/* home */
#home{align-items:center;justify-content:center;gap:22px;background:radial-gradient(ellipse at 50% 120%,#1d4d2a 0,#0b0e13 65%)}
.brand{text-align:center}.kicker{font-family:Oswald,"Arial Narrow",sans-serif;color:#ffcf3d;letter-spacing:.35em;font-size:13px}
.brand h1{font-size:64px;font-weight:700;line-height:1;text-shadow:0 4px 0 #000}
.sub{color:#8b95a5;font-size:12px;margin-top:4px}
.menu{display:flex;gap:12px;align-items:center}
.menu button:not(.big){border:1px solid #39424f;padding:10px 22px;border-radius:8px;font-family:Oswald,"Arial Narrow",sans-serif;font-size:17px;text-transform:uppercase}
/* headers */
header{display:flex;align-items:center;gap:10px;padding:8px 14px;padding-left:max(14px,env(safe-area-inset-left));border-bottom:1px solid #1d232c}
header h2{font-size:20px;text-transform:uppercase}
.back{font-size:26px;width:34px;height:34px;border-radius:6px;background:#161b23}
.rival{background:#b91c1c;color:#fff;font-family:Oswald,"Arial Narrow",sans-serif;font-size:12px;padding:3px 9px;border-radius:4px;text-transform:uppercase;letter-spacing:.08em}
/* select */
#select{background:#0b0e13}
.matchup{flex:1;display:flex;align-items:stretch;justify-content:center;gap:14px;padding:8px 18px;min-height:0}
.pickcol{flex:1;max-width:330px;background:#121821;border:1px solid #1f2731;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;overflow:hidden}
.pk-label{font-family:Oswald,"Arial Narrow",sans-serif;font-size:11px;letter-spacing:.3em;color:#8b95a5}
.pk-row{display:flex;align-items:center;gap:14px}
.arrow{font-size:30px;width:36px;height:44px;border-radius:8px;background:#1b222c}
.pk-name{font-size:22px;font-weight:700;line-height:1.05;text-transform:uppercase}
.pk-mascot{font-size:12px;color:#aab3c0;text-transform:uppercase;letter-spacing:.15em}
.ratings{display:flex;gap:14px;margin:3px 0}.ratings span{font-size:10px;color:#8b95a5;display:flex;flex-direction:column}.ratings b{font-family:Oswald,"Arial Narrow",sans-serif;font-size:20px;color:#fff}
.pk-desc{font-size:11px;color:#9aa4b2;line-height:1.35}
.vs{align-self:center;font-family:Oswald,"Arial Narrow",sans-serif;font-size:26px;color:#ffcf3d}
.kickrow{display:flex;gap:10px;align-items:center;justify-content:center;margin:0 0 12px}
/* badge */
.badge{border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Oswald,"Arial Narrow",sans-serif;font-weight:700;border:2px solid;flex-shrink:0}
img.logo{object-fit:contain;flex-shrink:0}
/* teams */
#teamGrid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px;padding:10px 14px;padding-left:max(14px,env(safe-area-inset-left));align-content:start}
.tcard{display:flex;align-items:center;gap:10px;text-align:left;background:#121821;border:1px solid #1f2731;border-left:4px solid var(--c1);border-radius:10px;padding:8px 10px}
.tc-body{flex:1;min-width:0}.tc-name{font-family:Oswald,"Arial Narrow",sans-serif;font-size:17px;text-transform:uppercase}.tc-name span{color:#8b95a5;font-size:13px}
.tc-meta{font-size:11px;color:#aab3c0}.tc-meta b{color:#fff}.tc-meta em{display:inline-block;margin-left:6px;color:#fbbf24;font-style:normal}
.sw{display:flex;gap:3px}.sw i{width:12px;height:12px;border-radius:3px;border:1px solid #39424f}
/* team detail */

/* Rotate prompt only on phones held upright. JS decides (handles iPad, split view and the app's side panel). */
html.needRotate #rotate{display:flex}
/* Tablet held upright or game shown in a tall panel: letterbox the landscape layout instead of asking to rotate */
html.lbox .screen{inset:auto 0 auto 0;top:calc((100% - min(100%,66vw))/2);height:min(100%,66vw)}

<script>
// Orientation: trust the DEVICE, not just this window. On iPad the game can sit in a tall panel while the iPad is landscape.
(function(){const h=document.documentElement;
 function devLandscape(){try{if(screen.orientation&&screen.orientation.type)return screen.orientation.type.indexOf('landscape')===0}catch(e){}
  if(typeof window.orientation==='number')return Math.abs(window.orientation)===90;return innerWidth>=innerHeight}
 function isPhone(){const m=Math.min(screen.width,screen.height);return m<600&&!/iPad/.test(navigator.userAgent)&&!(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)}
 function check(){const tall=innerHeight>innerWidth,phone=isPhone();h.classList.toggle('needRotate',tall&&phone&&!devLandscape());h.classList.toggle('lbox',tall&&!h.classList.contains('needRotate'));
  if(typeof resize==='function')requestAnimationFrame(()=>{try{resize()}catch(e){}})}
 check();addEventListener('resize',check);addEventListener('orientationchange',()=>setTimeout(check,150));try{screen.orientation&&screen.orientation.addEventListener('change',check)}catch(e){}})();
</script><div id="rotate"><div class="ph"></div><p style="font-family:Oswald,"Arial Narrow",sans-serif;font-size:20px">ROTATE TO LANDSCAPE</p></div>
