/* Rotate prompt only on phones held upright. JS decides (handles iPad, split view and the app's side panel). */
html.needRotate #rotate{display:flex}
/* Tablet held upright or game shown in a tall panel: letterbox the landscape layout instead of asking to rotate */
html.lbox .screen{inset:auto 0 auto 0;top:calc((100% - min(100%,66vw))/2);height:min(100%,66vw)}

<script>
// Orientation: trust the DEVICE, not just this window. On iPad the game can sit in a tall panel while the iPad is landscape.
(function(){const h=document.documentElement;
 function devLandscape(){try{if(screen.orientation&&screen.orientation.type)return screen.orientation.type.indexOf('landscape')===0}catch(e){}
  if(typeof window.orientation==='number')return Math.abs(window.orientation)===90;return innerWidth>=innerHeight}
 function isPhone(){const m=Math.min(screen.width,screen.height);return m<600&&!/iPad/.test(navigator.userAgent)&&!(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)}
 function check(){const tall=innerHeight>innerWidth,phone=isPhone();h.classList.toggle('needRotate',tall&&phone&&!devLandscape());h.classList.toggle('lbox',tall&&!h.classList.contains('needRotate'));
  if(typeof resize==='function')requestAnimationFrame(()=>{try{resize()}catch(e){}})}
 check();addEventListener('resize',check);addEventListener('orientationchange',()=>setTimeout(check,150));try{screen.orientation&&screen.orientation.addEventListener('change',check)}catch(e){}})();
